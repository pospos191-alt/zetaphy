name: "ZTPHY airdrop round 1: link a Solana wallet"
description: "SWD holders: link the Solana wallet that holds SWD to your ZETAPHY (EVM) address. Public, free, moves nothing."
title: "ZTPHY airdrop round 1: link a Solana wallet"
labels: ["airdrop-link"]
body:
  - type: markdown
    attributes:
      value: |
        **Read first** ([announcement](https://github.com/pospos191-alt/zetaphy/blob/main/docs/AIRDROP-ROUND1.md) · [ภาษาไทย](https://github.com/pospos191-alt/zetaphy/blob/main/docs/AIRDROP-ROUND1.th.md))

        - The easiest way to fill this form is the link page: **https://app.sawasdeecoin.com/airdrop-link.html**. It connects your Solana wallet, asks it to sign the link message and opens this form already filled in.
        - The message you sign is plain text: `ZETAPHY airdrop: link <your Solana address> to <your 0x address> on 3659`. Signing it is **free**, is **not a transaction** and **moves nothing**.
        - **ZETAPHY never asks for your recovery phrase (seed words), private key, a payment or a transaction approval.** Anyone who does is a scammer. Never paste any of those here or anywhere else.
        - This issue is **public**: everyone can see that this Solana wallet and this 0x address belong together.
        - Linking closes **2026-12-04 14:00 UTC** (21:00 Thailand). The SWD snapshot is **2026-11-20 14:00 UTC** (21:00 Thailand).
        - Made a mistake? Close your issue as **"not planned"** and open a new one. Two open links with different 0x addresses for one Solana wallet are both left out.
  - type: input
    id: solana
    attributes:
      label: Solana address
      description: "The Solana wallet that holds SWD at the snapshot (base58, e.g. 7xKX…). Not a token account, not an exchange deposit address."
      placeholder: "7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU"
    validations:
      required: true
  - type: input
    id: evm
    attributes:
      label: EVM address
      description: "Your ZETAPHY address (0x…, the same as in MetaMask / any EVM wallet), in EIP-55 checksum form. The coins can only ever go here."
      placeholder: "0x…"
    validations:
      required: true
  - type: dropdown
    id: chain
    attributes:
      label: Chain id
      description: "ZETAPHY mainnet (zetaphy_3659-1). Fixed."
      options:
        - "3659"
      default: 0
    validations:
      required: true
  - type: input
    id: signature
    attributes:
      label: Signature
      description: "The signature your Solana wallet gave for the link message (base58; 0x-hex or base64 also accepted). It is NOT your private key or recovery phrase."
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: "I did not share my recovery phrase (seed words) or private key with anyone, I paid nothing and approved no transaction to make this link."
          required: true
