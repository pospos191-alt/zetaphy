# Runs the one-command installer (install.sh runner) on a clean Ubuntu runner against ZETAPHY
# mainnet (chain 3659, public RPC https://129-221-199-191.sslip.io, NeuroJobs from
# zetaphy-launch/state/3659.contracts.json; the testnet was shut down 2026-11-14, owner decision),
# read only: the runner key is made, the service starts and waits for its bond (nothing is funded,
# signed or sent), the helper commands work, and uninstall leaves the key. A handful of small read
# calls (chain id, code, balance, bond), well inside the public RPC's egress budget.
# Also install.sh validator (a mainnet validator node) up to the node setup (DOWNLOAD_ONLY, GitHub only, no chain RPC):
# the signed release for this setup-node.sh is found and verified (Sigstore signature with the pinned cosign, SHA-256,
# setup-node.sh), a tampered binary is refused, and the published mainnet genesis is downloaded and checked against its
# published sha256; the testnet chain id is refused. It never joins the live chain from here (syncing would spend the
# sentry's traffic allowance).
# The same download step on other Linux systems (Debian, Fedora, Rocky, Amazon Linux, openSUSE, Arch)
# installs what it needs with that system's package manager.
# Cost: free (GitHub-hosted runner, public repository).

name: runner-install

on:
  pull_request:
    paths:
      - 'install.sh'
      - 'zetaphy-network/setup-runner.sh'
      - 'zetaphy-network/cli.js'
      - 'zetaphy-chain/join-validator.sh'
      - 'zetaphy-chain/verify-release.sh'
      - 'zetaphy-chain/mainnet/zetaphy_3659-1/genesis.json'
      - '.github/workflows/runner-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    name: One-command runner install
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install with the one command (code pinned to this commit)
        run: |
          # the same pipe a user runs, with this commit's install.sh and code
          cat install.sh | sudo REF="$REF" bash -s -- runner | tee /tmp/install.log
          grep -Eq '^runner: +0x[0-9a-fA-F]{40}' /tmp/install.log
      - name: The service runs and waits for its bond
        run: |
          for _ in $(seq 1 30); do s=$(sudo journalctl -u zetaphy-runner --no-pager); grep -q 'waiting for funds' <<<"$s" && break; sleep 3; done
          systemctl is-active zetaphy-runner
          sudo journalctl -u zetaphy-runner --no-pager | tail -8
          grep -q 'waiting for funds' <<<"$(sudo journalctl -u zetaphy-runner --no-pager)"
      - name: Helper commands; re-run keeps the key
        run: |
          a1=$(sudo zetaphy-runner address); echo "$a1"
          sudo zetaphy-runner status
          cat install.sh | sudo REF="$REF" bash -s -- runner > /dev/null
          a2=$(sudo zetaphy-runner address)
          [ "$a1" = "$a2" ] || { echo "::error::re-running the installer changed the runner key"; exit 1; }
          sudo test "$(sudo stat -c %a /var/lib/zetaphy-runner)" = 700
      - name: Uninstall keeps the key
        run: |
          sudo zetaphy-runner uninstall
          ! systemctl is-active zetaphy-runner
          sudo test -f /var/lib/zetaphy-runner/worker.key
          key=$(sudo cat /var/lib/zetaphy-runner/worker.key); key=${key#0x}
          sudo journalctl --no-pager > /tmp/journal.log
          if grep -qi "$key" /tmp/install.log /tmp/journal.log; then echo "::error::the runner key is in a log"; exit 1; fi

  validator-download:
    name: One-command validator install (download and verify only)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Which signed release to test (this setup-node.sh's, or the base branch's before it is built)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A release is built and signed only after setup-node.sh lands on main, so a pull request that changes
          # setup-node.sh has none yet: test the download and verification with the base branch's signed release.
          rel=https://github.com/pospos191-alt/zetaphy/releases/download
          tag=zetaphyd-$(sha256sum zetaphy-chain/setup-node.sh | cut -c1-12)
          if ! curl -fsSL "$rel/$tag/RELEASE.json" -o /dev/null && [ -n "$BASE_SHA" ]; then
            base=zetaphyd-$(curl -fsSL "https://raw.githubusercontent.com/pospos191-alt/zetaphy/$BASE_SHA/zetaphy-chain/setup-node.sh" | sha256sum | cut -c1-12)
            echo "::notice::no signed release $tag yet (built after merge); testing with the base branch's $base"
            tag=$base
          fi
          curl -fsSL "$rel/$tag/RELEASE.json" -o /dev/null || { echo "::error::no signed release $tag"; exit 1; }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Signed zetaphyd release for this setup-node.sh, verified
        run: |
          cat install.sh | sudo REF="$REF" RELEASE_TAG="$RELEASE_TAG" DOWNLOAD_ONLY=1 bash -s -- validator | tee /tmp/v.log
          grep -q 'SHA-256 ok' /tmp/v.log
          grep -q "release $RELEASE_TAG" /tmp/v.log
          (cd /usr/local/lib/zetaphy-validator && sha256sum -c --ignore-missing SHA256SUMS)
          # the published mainnet genesis, checked against the sha256 published with it
          want=$(cut -d' ' -f1 zetaphy-chain/mainnet/zetaphy_3659-1/genesis.sha256)
          [ "$want" = ca0efb15f6ca80f57e157b32837e012a15f3dc3597531b18747629c8f0a94667 ]
          grep -q "genesis zetaphy_3659-1: sha256 $want ok" /tmp/v.log
          echo "$want  /usr/local/lib/zetaphy-validator/genesis.json" | sha256sum -c -
          grep -q 'DOWNLOAD_ONLY: stopping before the node setup' /tmp/v.log
      - name: The testnet (shut down 2026-11-14) and a public RPC on a validator are refused, before anything is installed
        run: |
          for e in CHAIN_ID=zetaphy_77390-1 JOIN=rpc.sawasdeecoin.com; do
            if cat install.sh | sudo REF="$REF" "$e" DOWNLOAD_ONLY=1 bash -s -- validator > /tmp/t.log 2>&1; then
              cat /tmp/t.log; echo "::error::$e was not refused"; exit 1
            fi
            cat /tmp/t.log
            grep -q 'was shut down 2026-11-14' /tmp/t.log
            grep -q 'refused, nothing was installed' /tmp/t.log
          done
          for e in PUBLIC_RPC=1 MAINNET_FAUCET=1; do
            if cat install.sh | sudo REF="$REF" "$e" DOWNLOAD_ONLY=1 bash -s -- validator > /tmp/t.log 2>&1; then
              cat /tmp/t.log; echo "::error::$e was not refused on a validator"; exit 1
            fi
            grep -q "${e}: a validator never serves a public RPC or a faucet" /tmp/t.log
          done
      - name: A binary that does not match its signed release is refused
        run: |
          d=/usr/local/lib/zetaphy-validator
          sudo sh -c "printf x >> $d/zetaphyd-linux-amd64"
          # the pinned verifier the install used (verify-release.sh + cosign in $d), on the tampered file
          if PATH="$d/bin:$PATH" VERIFIER=cosign bash "$d/verify-release.sh" --dir "$d" --arch amd64 \
              --record-file /nonexistent/record.json > /tmp/t.log 2>&1; then
            cat /tmp/t.log; echo "::error::a tampered binary passed verify-release.sh"; exit 1
          fi
          cat /tmp/t.log
          grep -q 'REFUSED: zetaphyd-linux-amd64: sha256' /tmp/t.log
          # join-validator.sh stops before anything is installed when that check refuses (internal review 2026-11-10, Z-04)
          grep -q 'did not verify (the REFUSED line above says why): refused, nothing was installed' zetaphy-chain/join-validator.sh
      - name: This machine passes the preflight (Linux with systemd)
        run: sudo bash zetaphy-chain/join-validator.sh preflight
      - name: The timer logic and the preflight (fake chain, fake machines)
        working-directory: zetaphy-network
        run: node --test test/joinvalidator.test.js

  validator-distros:
    name: Validator download on ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        image: ['debian:12', 'fedora:41', 'rockylinux:9', 'amazonlinux:2023', 'opensuse/leap:15.6', 'archlinux:latest']
    env:
      REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Which signed release to test (this setup-node.sh's, or the base branch's before it is built)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # A release is built and signed only after setup-node.sh lands on main, so a pull request that changes
          # setup-node.sh has none yet: test the download and verification with the base branch's signed release.
          rel=https://github.com/pospos191-alt/zetaphy/releases/download
          tag=zetaphyd-$(sha256sum zetaphy-chain/setup-node.sh | cut -c1-12)
          if ! curl -fsSL "$rel/$tag/RELEASE.json" -o /dev/null && [ -n "$BASE_SHA" ]; then
            base=zetaphyd-$(curl -fsSL "https://raw.githubusercontent.com/pospos191-alt/zetaphy/$BASE_SHA/zetaphy-chain/setup-node.sh" | sha256sum | cut -c1-12)
            echo "::notice::no signed release $tag yet (built after merge); testing with the base branch's $base"
            tag=$base
          fi
          curl -fsSL "$rel/$tag/RELEASE.json" -o /dev/null || { echo "::error::no signed release $tag"; exit 1; }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: install.sh validator (DOWNLOAD_ONLY) in a clean ${{ matrix.image }}
        run: |
          # curl first, as a user needs it to run the one-liner at all; the script installs the rest
          docker run --rm -e REF="$REF" -e RELEASE_TAG="$RELEASE_TAG" -e DOWNLOAD_ONLY=1 -v "$PWD:/repo:ro" "${{ matrix.image }}" bash -c '
            set -e
            command -v curl >/dev/null || { command -v apt-get >/dev/null && apt-get update -qq && apt-get install -y -qq curl >/dev/null; }
            bash /repo/install.sh validator | tee /tmp/v.log
            grep -q "SHA-256 ok" /tmp/v.log
            grep -q "genesis zetaphy_3659-1: sha256 ca0efb15f6ca80f57e157b32837e012a15f3dc3597531b18747629c8f0a94667 ok" /tmp/v.log
            echo "ca0efb15f6ca80f57e157b32837e012a15f3dc3597531b18747629c8f0a94667  /usr/local/lib/zetaphy-validator/genesis.json" | sha256sum -c -
            for c in jq python3 flock; do command -v $c >/dev/null || { echo "::error::$c was not installed"; exit 1; }; done'

