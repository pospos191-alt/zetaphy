# The public registry of ZETAPHY audit certificates (docs/future/audit-as-a-service.md). No server: every few
# hours this reads ZETAPHY's own events (AuditCertificate.CertificateIssued, AuditNetwork.RequestUri) from the
# public testnet RPC, writes audit-registry.json + one static SVG badge per certificate, and force-pushes them as
# ONE commit to the orphan branch `audit-registry` (no history kept: the chain is the history).
#   - the hub's Audit Directory (audits.html) reads
#     https://raw.githubusercontent.com/pospos191-alt/zetaphy/audit-registry/audit-registry.json
#   - websites embed https://cdn.jsdelivr.net/gh/pospos191-alt/zetaphy@audit-registry/badges/<chain>-<address>.svg
# The registry is an index, not the authority: the certificate page (audit.html) re-reads ZETAPHY and the target
# chain live. No secrets: only public RPC reads and a push to that one branch with the workflow's own token.
name: audit-registry

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: audit-registry
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # push branch audit-registry (only that branch)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # pushes branch audit-registry below

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Dependencies
        run: cd zetaphy-network && npm ci --no-audit --no-fund --omit=dev

      - name: Build the registry from ZETAPHY's events
        run: node zetaphy-network/cli.js aas registry --out "$RUNNER_TEMP/registry"

      - name: Publish to branch audit-registry
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -q --orphan audit-registry
          rm -rf badges audit-registry.json README.md
          cp -r "$RUNNER_TEMP/registry/." .
          mkdir -p badges && touch badges/.keep
          printf '# ZETAPHY audit registry\n\nBuilt by %s from the ZETAPHY testnet. An index only: check a certificate live at https://app.sawasdeecoin.com/audit.html\n' "$RUN_URL" > README.md
          git add audit-registry.json badges README.md
          git commit -q -m "audit registry $(date -u +%FT%TZ)" -m "Generated by $RUN_URL"
          git push -fq origin audit-registry
          echo "$(node -e 'console.log(JSON.parse(require("fs").readFileSync("audit-registry.json")).entries.length)') certificate(s) published" >> "$GITHUB_STEP_SUMMARY"
