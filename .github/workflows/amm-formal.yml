# Long-running AMM checks (2026-11-10) — manual or weekly, never on PRs.
#
#   fuzz   libFuzzer (cargo-fuzz, nightly) on every target in
#          programs/swd_amm/fuzz for FUZZ_SECONDS each. A crash fails the
#          job and uploads the reproducer: copy it into
#          programs/swd_amm/fuzz/regressions/<target>/ with the fix, so the
#          per-PR amm-fuzz job (security.yml) replays it forever.
#   kani   the Kani proofs in programs/swd_amm/kani that complete (~7 min).
#          Harnesses marked SLOW (cfg kani_slow) are not run: CBMC did not
#          finish them in 15-25 min; their properties are checked
#          exhaustively on small domains by fuzz/tests/exhaustive.rs (per PR).
#   kani-slow  manual only (input kani_slow = v2 | all): each SLOW harness in
#          its own job with a time limit, so one run shows which of them
#          finish when given hours. A harness that hits the limit is
#          reported as cancelled — "not finished", not "property false".
#
# What these do and do not prove: docs/FUZZING_FORMAL.md.

name: AMM fuzz + formal (long)

on:
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: "libFuzzer seconds per target"
        default: "600"
      kani_slow:
        description: "Also run the SLOW Kani harnesses, one job each: none | v2 (the mainnet scope: SWDMM v2 math) | all (+ CP and DLMM)"
        type: choice
        options: [none, v2, all]
        default: none
      kani_slow_minutes:
        description: "Time limit per SLOW harness (minutes, max 350)"
        default: "180"
  schedule:
    - cron: '41 2 * * 0' # Sundays

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      FUZZ_SECONDS: ${{ github.event.inputs.fuzz_seconds || '600' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz every target
        working-directory: programs/swd_amm
        run: |
          for t in $(cargo +nightly fuzz list --fuzz-dir fuzz); do
            echo "::group::$t"
            cargo +nightly fuzz run --fuzz-dir fuzz -O -a "$t" -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=4096 -timeout=10 -print_final_stats=1
            echo "::endgroup::"
          done
      - name: Upload crash reproducers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: programs/swd_amm/fuzz/artifacts/
          retention-days: 30

  kani:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run every proof
        working-directory: programs/swd_amm/kani
        run: cargo kani

  kani-slow:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.kani_slow != 'none'
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ fromJSON(github.event.inputs.kani_slow_minutes || '180') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { harness: v2_fee_amount_u32, scope: v2 }
          - { harness: v2_swap_props_u16, scope: v2 }
          - { harness: v2_liquidity_never_over_issues_u16, scope: v2 }
          - { harness: v2_fee_growth_never_over_pays, scope: v2 }
          - { harness: v2_pending_fee_split_never_creates_fees, scope: v2 }
          - { harness: cp_swap_out_props_u16, scope: all }
          - { harness: cp_lp_mint_never_over_issues_u16, scope: all }
          - { harness: cp_lp_burn_never_over_pays_u16, scope: all }
          - { harness: cp_mul_div_exact_bounded, scope: all }
          - { harness: dlmm_q64_mul_no_panic_full_domain, scope: all }
          - { harness: dlmm_conversion_rounding_favours_pool, scope: all }
          - { harness: dlmm_bin_price_no_panic_any_id, scope: all }
          - { harness: dlmm_bin_price_monotone_small_ids, scope: all }
          - { harness: dlmm_bin_deposit_props, scope: all }
          - { harness: dlmm_bin_withdraw_props, scope: all }
          - { harness: dlmm_swap_bins_3_bins, scope: all }
    name: kani-slow (${{ matrix.harness }})
    steps:
      - uses: actions/checkout@v5
        if: matrix.scope == 'v2' || github.event.inputs.kani_slow == 'all'
        with:
          persist-credentials: false
      - name: Install Kani
        if: matrix.scope == 'v2' || github.event.inputs.kani_slow == 'all'
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run the SLOW proof
        if: matrix.scope == 'v2' || github.event.inputs.kani_slow == 'all'
        working-directory: programs/swd_amm/kani
        env:
          RUSTFLAGS: "--cfg kani_slow"
          HARNESS: ${{ matrix.harness }}
        run: cargo kani --harness "proofs::$HARNESS" --exact
