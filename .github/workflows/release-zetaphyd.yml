# Prebuilt zetaphyd: builds the chain binary exactly as setup-node.sh does on
# a server (pinned Cosmos EVM commit + the embedded ZETAPHY patch, `make
# install`), for Ubuntu 24.04 on x86_64 and ARM64, and publishes it with its
# SHA-256 as a GitHub Release named after the setup-node.sh fingerprint.
#
# Small machines (1 GB RAM) need hours to compile, or never finish linking.
# They can install this binary instead: setup-node.sh takes it through
# ZETAPHYD_BIN=<file> (see zetaphy-chain/README.md, "Prebuilt chain binary").
# Anyone can rebuild from the same sources and compare the hash.
# Signed (L1-3, docs/ANTI-ROLLBACK-OFFCHAIN.md): the sign job attests every binary, SHA256SUMS and RELEASE.json with
# Sigstore (keyless, GitHub OIDC); nodes check them with zetaphy-chain/verify-release.sh before installing, which also
# refuses a release older than the installed one.
name: release-zetaphyd

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['zetaphy-chain/setup-node.sh']

permissions:
  contents: read

concurrency:
  group: release-zetaphyd
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SRC: ${{ github.workspace }}/../cosmos-evm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.11'
          cache: false

      - name: Pinned Cosmos EVM source + the ZETAPHY patch
        run: |
          tag=$(sed -n 's/^COSMOS_EVM_TAG="\(.*\)"/\1/p' zetaphy-chain/setup-node.sh)
          commit=$(sed -n 's/^COSMOS_EVM_COMMIT="\(.*\)"/\1/p' zetaphy-chain/setup-node.sh)
          git clone -q --depth 1 --branch "$tag" https://github.com/cosmos/evm.git "$SRC"
          [ "$(git -C "$SRC" rev-parse HEAD)" = "$commit" ]
          bash zetaphy-chain/setup-node.sh --patch-source "$SRC"

      - name: Build (make install, as on the server)
        working-directory: ${{ env.SRC }}
        run: |
          make install
          mkdir -p "$RUNNER_TEMP/out"
          cp "$(go env GOPATH)/bin/evmd" "$RUNNER_TEMP/out/zetaphyd-linux-${{ matrix.arch }}"
          "$RUNNER_TEMP/out/zetaphyd-linux-${{ matrix.arch }}" version
          # CosmWasm: the binary links libwasmvm.<arch>.so (not bundled);
          # setup-node.sh installs wasmvm's release file, sha256-pinned.
          "$RUNNER_TEMP/out/zetaphyd-linux-${{ matrix.arch }}" q wasm libwasmvm-version
          ldd "$RUNNER_TEMP/out/zetaphyd-linux-${{ matrix.arch }}" | grep libwasmvm

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zetaphyd-linux-${{ matrix.arch }}
          path: ${{ runner.temp }}/out/zetaphyd-linux-${{ matrix.arch }}
          retention-days: 7

  # Signing (L1-3, docs/ANTI-ROLLBACK-OFFCHAIN.md): its own job, the only one that may get a GitHub OIDC token.
  # It writes SHA256SUMS and RELEASE.json (what this release is: setup-node.sh fingerprint, commit, its position on
  # main, the chain-upgrade handlers it carries) and signs ONE Sigstore build-provenance attestation (keyless, free)
  # over every binary, SHA256SUMS and RELEASE.json. The bundle is published with the release, so a node can check it
  # offline-ish (cosign) or with gh: zetaphy-chain/verify-release.sh. It cannot publish anything (no contents: write).
  sign:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write      # Sigstore keyless signing (Fulcio certificate for this workflow run)
      attestations: write  # stores the attestation on GitHub (gh attestation verify finds it there)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0   # RELEASE.json counts the commits on main (the release's position, for anti-rollback)

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          pattern: zetaphyd-linux-*
          merge-multiple: true

      - name: SHA256SUMS and RELEASE.json
        run: |
          short=$(sha256sum zetaphy-chain/setup-node.sh | cut -c1-12)
          # scripts: the SHA-256 of zetaphy-chain/join-validator.sh and verify-release.sh at this commit, so a node that
          # has only this signed RELEASE.json can fetch those files at the commit and check them before running them
          # as root (internal review 2026-11-10, Z-04)
          # the chain-upgrade handlers this binary carries (zetaphy-v2, ..., zetaphy-firewall): a binary missing
          # one the chain already ran is a rollback, whatever its date says
          upgrades=$(grep -oE '^\+const Zetaphy[A-Za-z0-9]*UpgradeName = "[^"]+"' zetaphy-chain/setup-node.sh \
            | sed -E 's/.*= "([^"]+)"/\1/' | sort -u | jq -R . | jq -cs .)
          jq -n --arg tag "zetaphyd-$short" --arg setup "$(sha256sum zetaphy-chain/setup-node.sh | cut -d' ' -f1)" \
            --arg commit "$GITHUB_SHA" --arg ref "$GITHUB_REF" --arg repo "$GITHUB_REPOSITORY" \
            --argjson seq "$(git rev-list --count "$GITHUB_SHA")" --argjson time "$(git log -1 --format=%ct "$GITHUB_SHA")" \
            --argjson upgrades "$upgrades" --arg run "$GITHUB_RUN_ID" \
            --arg jv "$(sha256sum zetaphy-chain/join-validator.sh | cut -d' ' -f1)" \
            --arg vr "$(sha256sum zetaphy-chain/verify-release.sh | cut -d' ' -f1)" \
            '{schema: "zetaphy-release/v1", tag: $tag, repository: $repo, setup_node_sha256: $setup, commit: $commit, ref: $ref,
              main_commits: $seq, commit_time: $time, upgrades: $upgrades, workflow_run: $run,
              scripts: {"join-validator.sh": $jv, "verify-release.sh": $vr}}' > out/RELEASE.json
          cat out/RELEASE.json
          cd out
          sha256sum zetaphyd-linux-* RELEASE.json > SHA256SUMS
          cat SHA256SUMS

      # One signed build provenance over all files. Anyone can check:
      #   gh attestation verify zetaphyd-linux-amd64 --repo pospos191-alt/zetaphy \
      #     --signer-workflow pospos191-alt/zetaphy/.github/workflows/release-zetaphyd.yml --source-ref refs/heads/main
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/zetaphyd-linux-*
            out/SHA256SUMS
            out/RELEASE.json

      - name: Keep the Sigstore bundle next to the files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" out/zetaphyd-provenance.sigstore.json
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: |
            out/zetaphyd-linux-*
            out/SHA256SUMS
            out/RELEASE.json
            out/zetaphyd-provenance.sigstore.json
          retention-days: 7

  release:
    needs: sign
    runs-on: ubuntu-24.04
    # Publishing is gated by the environment release (main only; required reviewer recommended:
    # docs/SECRETS-HARDENING.md). The build and sign jobs above need no environment.
    environment: release
    permissions:
      contents: write      # creates / updates the release; no OIDC token here (signing is the sign job's)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: out

      - name: Publish the release (setup-node.sh fingerprint as the tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short=$(sha256sum zetaphy-chain/setup-node.sh | cut -c1-12)
          tag="zetaphyd-$short"
          cd out
          sha256sum -c SHA256SUMS
          [ "$(jq -r .tag RELEASE.json)" = "$tag" ]
          {
            echo "zetaphyd built by GitHub Actions from \`zetaphy-chain/setup-node.sh\` $short (commit ${GITHUB_SHA})."
            echo
            echo "Ubuntu 24.04, x86_64 (amd64) and ARM64. Install on a node with ZETAPHYD_BIN=<file> (see zetaphy-chain/README.md)."
            echo "It links libwasmvm (CosmWasm) $(sed -n 's/^WASMVM_VERSION="\(.*\)"/\1/p' ../zetaphy-chain/setup-node.sh), which setup-node.sh installs (sha256 pinned)."
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Signed (Sigstore build provenance over the binaries, SHA256SUMS and RELEASE.json; bundle: zetaphyd-provenance.sigstore.json)."
            echo "Verify before installing (checks the signature is this repository's release workflow on main, the hashes, and refuses an older release):"
            echo "\`bash zetaphy-chain/verify-release.sh --dir <download dir> --arch amd64\` (docs/ANTI-ROLLBACK-OFFCHAIN.md)"
          } > notes.md
          files=(zetaphyd-linux-* SHA256SUMS RELEASE.json zetaphyd-provenance.sigstore.json)
          # A tag is never reused for other signed binaries (internal review 2026-11-12, Z-49): once a release has
          # RELEASE.json (it is signed), its files are final. A re-run for the same setup-node.sh (same tag) builds a
          # new RELEASE.json (another run, maybe another commit), so it stops here instead of replacing what nodes
          # verified and recorded. Only a release from before signing (no RELEASE.json) gets the signed files added.
          if gh release view "$tag" >/dev/null 2>&1; then
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name')
            if grep -qx 'RELEASE.json' <<<"$assets"; then
              gh release download "$tag" --pattern SHA256SUMS --output "$RUNNER_TEMP/published.SHA256SUMS" --clobber
              if cmp -s "$RUNNER_TEMP/published.SHA256SUMS" SHA256SUMS; then
                echo "$tag is already published with exactly these files: nothing to do"
              else
                echo "::error::$tag is already a signed release with other files; refusing to overwrite it (a new release needs a new setup-node.sh, i.e. a new tag)"
                diff "$RUNNER_TEMP/published.SHA256SUMS" SHA256SUMS || true
                exit 1
              fi
            else
              # a release published before signing existed: the signed files are added (same tag)
              gh release upload "$tag" "${files[@]}" --clobber
            fi
          else
            gh release create "$tag" "${files[@]}" --title "zetaphyd $short" --notes-file notes.md --target "$GITHUB_SHA"
          fi
