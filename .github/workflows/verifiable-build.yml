# Verifiable build of the swd_amm Solana program (2026-11-11).
#
# Builds the program deterministically with solana-verify (Ellipsis Labs / OtterSec: a pinned Docker image chosen by
# [workspace.metadata.cli] solana in the root Cargo.toml), for both feature sets:
#   devnet  — default features (what the CI deploy-devnet job ships)
#   mainnet — --features mainnet,v2-only (the audited scope)
# and publishes swd_amm-<flavour>.so, its IDL, SHA256SUMS and release.json as a GitHub Release, with signed build
# provenance (Sigstore). scripts/rollback-program.sh deploys/rolls back from these releases and checks their hashes;
# scripts/program-watch.mjs (workflow program-watch) alerts when the on-chain program differs from the latest one.
#
# Triggers:
#   push a tag program-vX.Y.Z   -> build + publish the Release program-vX.Y.Z (the tag must be on main's history)
#   Run workflow on main with new_tag=program-vX.Y.Z -> build + publish that Release; the release creates the tag
#                                  on the run's commit (for when tags cannot be pushed from where you work)
#   Run workflow (manual)       -> build; optionally publish (only when run on a program-v* tag), and if a
#                                  program id is given, print the exact solana-verify / OtterSec commands for it and
#                                  compare its on-chain hash with this build
#
# Anyone can check a published binary:  gh attestation verify swd_amm-mainnet.so --repo pospos191-alt/zetaphy
# and rebuild it themselves:            bash scripts/verified-build.sh release   (same hashes, any machine with Docker)
#
# No secrets: nothing here signs a Solana transaction or touches a key.

name: verifiable-build

on:
  push:
    tags: ['program-v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release (only when 'Use workflow from' is a program-v* tag)"
        type: boolean
        default: false
      new_tag:
        description: "Run on main only: publish a new Release with this tag (program-vX.Y.Z) on the run's commit (empty: none)"
        type: string
        default: ''
      program_id:
        description: "Deployed program id to print verification commands for (empty: skip)"
        type: string
        default: ''
      cluster:
        description: "Cluster of that program (devnet uses the devnet build, mainnet the mainnet,v2-only build)"
        type: choice
        options: [devnet, mainnet]
        default: devnet

permissions:
  contents: read

concurrency:
  group: verifiable-build-${{ github.ref }}
  cancel-in-progress: false

env:
  SOLANA_VERSION: "3.1.10"
  ANCHOR_VERSION: "0.31.1"
  SOLANA_VERIFY_VERSION: "0.5.2"
  RUST_TOOLCHAIN: "stable"

jobs:
  build:
    name: deterministic build (solana-verify, devnet + mainnet,v2-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write      # Sigstore build provenance
      attestations: write
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/share/swift
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: The tag must be on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main's history — tag a reviewed, merged commit"; exit 1; }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache solana-verify + Anchor CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/solana-verify
            ~/.avm
            ~/.cargo/bin/avm
            ~/.cargo/bin/anchor
          key: ${{ runner.os }}-verify-${{ env.SOLANA_VERIFY_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      # Anchor.toml pins [toolchain] solana_version, so `anchor idl build` runs `solana --version` first and fails with
      # "No such file or directory (os error 2)" when the Solana CLI is missing (the program itself builds in Docker).
      - name: Cache Solana CLI ${{ env.SOLANA_VERSION }}
        id: solana-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI ${{ env.SOLANA_VERSION }} (for anchor idl build)
        run: |
          if [ "${{ steps.solana-cache.outputs.cache-hit }}" != "true" ]; then
            sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install solana-verify ${{ env.SOLANA_VERIFY_VERSION }} and Anchor ${{ env.ANCHOR_VERSION }} (IDL only)
        run: |
          if ! solana-verify --version 2>/dev/null | grep -q "$SOLANA_VERIFY_VERSION"; then
            cargo install solana-verify --version "$SOLANA_VERIFY_VERSION" --locked --force
          fi
          if ! command -v avm >/dev/null 2>&1; then
            cargo install --git https://github.com/solana-foundation/anchor --tag "v${ANCHOR_VERSION}" avm --locked --force
          fi
          if ! anchor --version 2>/dev/null | grep -q "${ANCHOR_VERSION}"; then
            avm install "${ANCHOR_VERSION}"
          fi
          avm use "${ANCHOR_VERSION}"
          solana-verify --version
          anchor --version
          docker --version

      - name: Verifiable build (both flavours) + IDL + hashes
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.new_tag || '' }}
          IDL_TARGET_DIR: ${{ runner.temp }}/idl-target
        run: |
          [ -n "$RELEASE_TAG" ] || unset RELEASE_TAG
          bash scripts/verified-build.sh release dist/program
          {
            echo "### swd_amm verifiable build (commit \`$GITHUB_SHA\`)"
            echo '```'; cat dist/program/SHA256SUMS; echo '```'
            echo '```json'; cat dist/program/release.json; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Signed build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/program/*.so
            dist/program/*.idl.json

      - name: Keep the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swd_amm-verifiable-build
          path: dist/program/
          retention-days: 90

      # Manual input: the exact commands anyone can run, plus a live comparison with the chain (read only).
      - name: Verification commands for the deployed program
        if: github.event_name == 'workflow_dispatch' && inputs.program_id != ''
        env:
          PROGRAM_ID: ${{ inputs.program_id }}
          CLUSTER: ${{ inputs.cluster }}
        run: |
          [[ "$PROGRAM_ID" =~ ^[1-9A-HJ-NP-Za-km-z]{32,44}$ ]] || { echo "::error::program_id is not a base58 address"; exit 1; }
          case "$CLUSTER" in devnet) RPC=https://api.devnet.solana.com ;; mainnet) RPC=https://api.mainnet-beta.solana.com ;; *) exit 1 ;; esac
          bash scripts/verified-build.sh verify-command "$PROGRAM_ID" "$CLUSTER" "$GITHUB_SHA" "$RPC" | tee verify-commands.txt
          want=$(python3 -c 'import json,sys; print(json.load(open("dist/program/release.json"))["builds"][sys.argv[1]]["executable_hash"])' "$CLUSTER")
          have=$(solana-verify get-program-hash -u "$RPC" "$PROGRAM_ID" 2>/dev/null | tail -1 || true)
          echo "this build ($CLUSTER): $want"
          echo "on chain:              ${have:-<could not read>}"
          echo "OtterSec record:       $(curl -s --max-time 20 "https://verify.osec.io/status/$PROGRAM_ID" || echo '<unreachable>')"
          {
            echo "### Verify $PROGRAM_ID ($CLUSTER)"
            echo "- this build: \`$want\`"
            echo "- on chain:   \`${have:-could not read}\`"
            if [ "$have" = "$want" ]; then echo "- **MATCH**: the on-chain program is exactly this commit."; else echo "- **DIFFERENT** (or unreadable): the on-chain program is not this commit's $CLUSTER build."; fi
            echo '```bash'; cat verify-commands.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean the build directories
        if: always()
        run: sudo rm -rf target "$RUNNER_TEMP/idl-target"

  publish:
    name: publish the GitHub Release
    needs: build
    if: >-
      (startsWith(github.ref, 'refs/tags/program-v') && (github.event_name == 'push' || inputs.publish)) ||
      (github.event_name == 'workflow_dispatch' && inputs.new_tag != '' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: swd_amm-verifiable-build
          path: dist/program

      - name: Create / update the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.new_tag || github.ref_name }}
          NEW_TAG: ${{ inputs.new_tag || '' }}
          REPO: ${{ github.repository }}
        run: |
          [[ "$TAG" =~ ^program-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag must look like program-v1.2.3"; exit 1; }
          if [ -n "$NEW_TAG" ] && gh api "repos/$REPO/git/ref/tags/$NEW_TAG" >/dev/null 2>&1; then
            # never move an existing tag: run the workflow on that tag instead
            echo "::error::tag $NEW_TAG already exists; run the workflow on it with publish=true"; exit 1
          fi
          cd dist/program
          sha256sum -c SHA256SUMS
          ex() { python3 -c 'import json,sys; b=json.load(open("release.json"))["builds"][sys.argv[1]]; print(b["executable_hash"])' "$1"; }
          {
            echo "swd_amm program built reproducibly (solana-verify ${SOLANA_VERIFY_VERSION}, Solana ${SOLANA_VERSION}, Anchor ${ANCHOR_VERSION}) from commit ${GITHUB_SHA}."
            echo
            echo "| file | features | executable hash (= \`solana-verify get-program-hash\` once deployed) |"
            echo "|---|---|---|"
            echo "| swd_amm-devnet.so | (default) | \`$(ex devnet)\` |"
            echo "| swd_amm-mainnet.so | mainnet,v2-only | \`$(ex mainnet)\` |"
            echo
            echo '```'; cat SHA256SUMS; echo '```'
            echo
            echo "- Provenance: \`gh attestation verify swd_amm-mainnet.so --repo ${REPO}\`"
            echo "- Rebuild yourself: \`git checkout ${GITHUB_SHA} && bash scripts/verified-build.sh release\`"
            echo "- Check a deployed program: \`bash scripts/verified-build.sh verify-command <PROGRAM_ID> <devnet|mainnet> ${GITHUB_SHA}\`"
            echo "- Roll back to this release: \`bash scripts/rollback-program.sh prepare ${TAG} --cluster <devnet|mainnet>\` (docs/PROGRAM_ROLLBACK.md)"
          } > ../notes.md
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            # A published release is never silently replaced by different bytes (that would defeat the point).
            mkdir -p ../old && gh release download "$TAG" --repo "$REPO" -p release.json -D ../old
            for f in devnet mainnet; do
              old=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["builds"][sys.argv[2]]["executable_hash"])' ../old/release.json "$f")
              [ "$old" = "$(ex "$f")" ] || { echo "::error::$TAG already published a different $f binary ($old). Builds must be reproducible — investigate; never overwrite a release."; exit 1; }
            done
            echo "$TAG already exists with the same hashes — nothing to do."
          else
            gh release create "$TAG" ./* --title "swd_amm $TAG" --notes-file ../notes.md --target "$GITHUB_SHA" --repo "$REPO"
          fi
