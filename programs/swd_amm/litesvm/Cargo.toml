# Stateful sequence fuzzing of the BUILT swd_amm program (target/deploy/
# swd_amm.so) inside LiteSVM — a real SBF VM + the real SPL Token program,
# no validator (2026-11-10). Standalone crate (own [workspace]); it does
# not link the program crate, it loads the .so and builds instructions
# from the Anchor IDL (target/idl/swd_amm.json).
#
#   anchor build -p swd_amm
#   cargo test --release --manifest-path programs/swd_amm/litesvm/Cargo.toml -- --nocapture
#   SWD_SVM_SEEDS=200 SWD_SVM_STEPS=300 cargo test --release ...
#
# See docs/FUZZING_FORMAL.md.
[package]
name = "swd_amm_litesvm"
version = "0.0.0"
publish = false
edition = "2021"

[dependencies]

[dev-dependencies]
litesvm = "0.18.2"
solana-keypair = "3"
solana-signer = "3"
solana-pubkey = "3"
solana-instruction = "3"
solana-transaction = "4"
solana-message = "4"
solana-account = "4"
solana-sdk-ids = "3"
solana-clock = "3"
solana-system-interface = { version = "3", features = ["bincode"] }
solana-loader-v3-interface = { version = "8", features = ["serde"] }
serde_json = "1"
sha2 = "0.10"
bincode = "1"
swd_amm_fuzz = { path = "../fuzz" }

[workspace]
members = ["."]
