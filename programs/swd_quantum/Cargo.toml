[package]
name = "swd_quantum"
version = "0.1.0"
description = "SWD Quantum: hash-based (LM-OTS / Winternitz) quantum-safe vaults and a post-quantum key commitment registry — UNAUDITED, not deployed; see docs/SWD_QUANTUM.md"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "swd_quantum"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# Mainnet build: the PQ commitment rotation delay is 7 days (devnet/localnet
# builds use 8 seconds so the flow can be tried and tested). Build with
# `anchor build -p swd_quantum -- --features mainnet` for any mainnet deployment.
mainnet = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
# init-if-needed: deposit_token creates the vault's associated token account
# on the first deposit of a mint (the depositor pays its rent), and
# commit_pq_key creates the wallet's commitment record on its first commit.
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
# Classic SPL Token AND Token-2022 (token_interface); token_2022_extensions
# lets the program read a Token-2022 mint's extension list and refuse the
# ones that are unsafe for a vault (see `mint_policy` in lib.rs).
anchor-spl = { version = "0.31.1", features = ["token_2022", "token_2022_extensions"] }

# cfgs that Anchor's macros emit (silences "unexpected cfg" noise only)
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))'] }
